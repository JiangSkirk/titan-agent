[project]
name = "orin-proto"
version = "2.0.0"
description = "orin/v2 wire frames — no runtime, no secrets, no GuardianSPI"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "MIT"}
authors = [{name = "JS Team"}]
dependencies = []

[project.urls]
Repository = "https://github.com/JiangSkirk/titan-agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orin_proto"]

[tool.hatch.build.targets.sdist]
include = [
    "/orin_proto",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/THIRD_PARTY_NOTICES.md",
    "/pyproject.toml",
]
