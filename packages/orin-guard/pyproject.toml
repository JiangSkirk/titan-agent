[project]
name = "orin-guard"
version = "2.0.0"
description = "Orin 2.0 — standalone process-out agent security authority (gate, IFC, credentials, MCP)"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "MIT"}
authors = [{name = "JS Team"}]
dependencies = [
    "echo-core==3.0.0",
    "orin-proto==2.0.0",
]

[project.urls]
Repository = "https://github.com/JiangSkirk/titan-agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orin_guard"]

[tool.hatch.build.targets.sdist]
include = [
    "/orin_guard",
    "/examples",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/THIRD_PARTY_NOTICES.md",
    "/pyproject.toml",
]

[tool.uv.sources]
echo-core = { workspace = true }
orin-proto = { workspace = true }
