[project]
name = "echo-core"
version = "3.0.0"
description = "Echo 3.0 — standalone fail-closed agent runtime kernel (leases, ledger, pulse, phylogeny)"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "MIT"}
authors = [{name = "JS Team"}]
dependencies = [
    "rfc8785==0.1.4",
    "psutil>=6.1,<8",
]

[project.urls]
Repository = "https://github.com/JiangSkirk/titan-agent"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["echo_core"]

[tool.hatch.build.targets.sdist]
include = [
    "/echo_core",
    "/examples",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/THIRD_PARTY_NOTICES.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
